# Expected result: rejected only by the cnas-disallow-latest-tag Kyverno policy.
apiVersion: v1
kind: Pod
metadata:
  name: policy-test-latest
  namespace: cnas
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      image: busybox:latest
      command: ["sh", "-c", "true"]
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        runAsNonRoot: true
        runAsUser: 65534
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 1m
          memory: 4Mi
        limits:
          cpu: 10m
          memory: 16Mi
