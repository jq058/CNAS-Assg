apiVersion: batch/v1
kind: Job
metadata:
  name: cnas-load-test
  namespace: cnas
  labels:
    app.kubernetes.io/name: cnas-load-test
    app.kubernetes.io/part-of: cnas-validation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 240
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cnas-load-test
        app.kubernetes.io/part-of: cnas-validation
        access-profile: validation
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: load-generator
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          env:
            - name: TARGET_URL
              value: http://php-service.cnas.svc.cluster.local/
            - name: DURATION_SECONDS
              value: "180"
            - name: WORKERS
              value: "8"
          command:
            - /bin/sh
            - -ec
          args:
            - |
              stop_at=$(( $(date +%s) + DURATION_SECONDS ))
              worker() {
                worker_id="$1"
                requests=0
                failures=0
                while [ "$(date +%s)" -lt "$stop_at" ]; do
                  if wget -q -T 5 -O /dev/null "$TARGET_URL"; then
                    requests=$((requests + 1))
                  else
                    failures=$((failures + 1))
                  fi
                done
                echo "worker=${worker_id} successes=${requests} failures=${failures}"
              }

              echo "Generating load against ${TARGET_URL} for ${DURATION_SECONDS}s with ${WORKERS} workers"
              index=1
              while [ "$index" -le "$WORKERS" ]; do
                worker "$index" &
                index=$((index + 1))
              done
              wait
              echo "Load generation complete. Review HPA history and application error rate."
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: 500m
              memory: 64Mi
