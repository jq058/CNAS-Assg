apiVersion: batch/v1
kind: Job
metadata:
  name: cnas-smoke-test
  namespace: cnas
  labels:
    app.kubernetes.io/name: cnas-smoke-test
    app.kubernetes.io/part-of: cnas-validation
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cnas-smoke-test
        app.kubernetes.io/part-of: cnas-validation
        access-profile: validation
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smoke
          image: curlimages/curl:8.12.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              echo "Checking application Service..."
              curl --fail --silent --show-error --max-time 10 \
                http://php-service.cnas.svc.cluster.local/readyz.php > /tmp/service.html
              grep -q "ready" /tmp/service.html

              echo "Checking Gateway API route..."
              curl --fail --silent --show-error --insecure --max-time 10 \
                -H "Host: cnas.local" \
                https://kong-gateway-proxy.kong.svc.cluster.local/ \
                > /tmp/gateway.html
              grep -q "Team Members" /tmp/gateway.html
              echo "PASS: Service and gateway returned the application."
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
