# Expected result: rejected by Pod Security Admission or, when PSA is not
# enabled, by the cnas-require-run-as-non-root Kyverno policy.
apiVersion: v1
kind: Pod
metadata:
  name: policy-test-root
  namespace: cnas
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      image: busybox:1.36.1
      command: ["sh", "-c", "true"]
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        runAsNonRoot: false
        runAsUser: 0
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 1m
          memory: 4Mi
        limits:
          cpu: 10m
          memory: 16Mi
