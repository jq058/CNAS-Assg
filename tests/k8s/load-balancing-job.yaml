# scripts/Test-LoadBalancing.ps1 replaces __MARKER__ at runtime, sends these
# requests through Kong, then confirms the marker in multiple PHP Pod logs.
apiVersion: batch/v1
kind: Job
metadata:
  name: cnas-load-balancing-test
  namespace: cnas
  labels:
    app.kubernetes.io/name: cnas-load-balancing-test
    app.kubernetes.io/part-of: cnas-validation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cnas-load-balancing-test
        app.kubernetes.io/part-of: cnas-validation
        access-profile: validation
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway-client
          image: curlimages/curl:8.12.1
          imagePullPolicy: IfNotPresent
          env:
            - name: MARKER
              value: __MARKER__
            - name: GATEWAY_URL
              value: https://kong-gateway-proxy.kong.svc.cluster.local/
          command:
            - /bin/sh
            - -ec
          args:
            - |
              request=1
              while [ "$request" -le 50 ]; do
                curl --fail --silent --show-error --insecure --max-time 5 \
                  -H 'Host: cnas.local' \
                  "${GATEWAY_URL}?lb_probe=${MARKER}" > /dev/null
                request=$((request + 1))
              done
              echo "marker=${MARKER} successful_requests=50"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
