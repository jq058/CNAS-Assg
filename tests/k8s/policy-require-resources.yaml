# Expected result: rejected only by the cnas-require-resources Kyverno policy.
apiVersion: v1
kind: Pod
metadata:
  name: policy-test-no-limits
  namespace: cnas
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      image: busybox:1.36.1
      command: ["sh", "-c", "true"]
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        runAsNonRoot: true
        runAsUser: 65534
        capabilities:
          drop:
            - ALL
