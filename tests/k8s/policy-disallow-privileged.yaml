# Expected result: rejected by Pod Security Admission or, when PSA is not
# enabled, by the cnas-restricted-containers Kyverno policy.
apiVersion: v1
kind: Pod
metadata:
  name: policy-test-privileged
  namespace: cnas
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      image: busybox:1.36.1
      command: ["sh", "-c", "true"]
      securityContext:
        privileged: true
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65534
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 1m
          memory: 4Mi
        limits:
          cpu: 10m
          memory: 16Mi
