# This is a positive security test: the connection attempt must fail, and the
# Job exits successfully only when an untrusted Pod cannot reach MySQL.
apiVersion: batch/v1
kind: Job
metadata:
  name: cnas-network-policy-test
  namespace: cnas
  labels:
    app.kubernetes.io/name: cnas-network-policy-test
    app.kubernetes.io/part-of: cnas-validation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 45
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cnas-network-policy-test
        app.kubernetes.io/part-of: cnas-validation
        access-profile: untrusted
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verify-denial
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              echo "Expecting MySQL port 3306 to be blocked for this untrusted Pod..."
              # mysql-service is headless, so Kubernetes does not inject a
              # *_SERVICE_HOST variable. Resolve it first and require a Pod IP
              # so a DNS failure cannot be mistaken for policy enforcement.
              mysql_ip="$(nslookup mysql-service | awk '/^Address: / { address=$2 } END { print address }')"
              test -n "$mysql_ip"
              echo "Resolved mysql-service to $mysql_ip; attempting a direct TCP connection..."
              if nc -z -w 5 "$mysql_ip" 3306; then
                echo "FAIL: MySQL was reachable. The CNI is not enforcing the policy or the policy is too broad."
                exit 1
              fi
              echo "PASS: MySQL connection was denied as expected."
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
