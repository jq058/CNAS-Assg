apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: cnas-require-run-as-non-root
  annotations:
    policies.kyverno.io/title: Require runAsNonRoot
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
spec:
  background: true
  failurePolicy: Fail
  rules:
    - name: require-run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - cnas
      preconditions:
        all:
          - key: "{{ request.operation || 'BACKGROUND' }}"
            operator: NotEquals
            value: DELETE
      validate:
        failureAction: Enforce
        message: Pods must require non-root execution at Pod level or on every container.
        anyPattern:
          # A Pod-level requirement applies to all containers. Explicit
          # container overrides, when present, may not weaken it.
          - spec:
              securityContext:
                runAsNonRoot: true
              "=(ephemeralContainers)":
                - "=(securityContext)":
                    "=(runAsNonRoot)": true
              "=(initContainers)":
                - "=(securityContext)":
                    "=(runAsNonRoot)": true
              containers:
                - "=(securityContext)":
                    "=(runAsNonRoot)": true
          # Alternatively, each individual container must state the control.
          - spec:
              "=(ephemeralContainers)":
                - securityContext:
                    runAsNonRoot: true
              "=(initContainers)":
                - securityContext:
                    runAsNonRoot: true
              containers:
                - securityContext:
                    runAsNonRoot: true
