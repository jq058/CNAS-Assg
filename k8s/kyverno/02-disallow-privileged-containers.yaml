apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: cnas-restricted-containers
  annotations:
    policies.kyverno.io/title: Enforce Restricted Container Security
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
spec:
  background: true
  failurePolicy: Fail
  rules:
    - name: disallow-privileged-and-escalation
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - cnas
      preconditions:
        all:
          - key: "{{ request.operation || 'BACKGROUND' }}"
            operator: NotEquals
            value: DELETE
      validate:
        failureAction: Enforce
        message: Privileged containers and privilege escalation are not allowed.
        foreach:
          - list: request.object.spec.[ephemeralContainers, initContainers, containers][]
            pattern:
              securityContext:
                "=(privileged)": false
                allowPrivilegeEscalation: false
    - name: require-drop-all-capabilities
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - cnas
      preconditions:
        all:
          - key: "{{ request.operation || 'BACKGROUND' }}"
            operator: NotEquals
            value: DELETE
      validate:
        failureAction: Enforce
        message: Every container must explicitly drop all Linux capabilities.
        foreach:
          - list: request.object.spec.[ephemeralContainers, initContainers, containers][]
            deny:
              conditions:
                all:
                  - key: ALL
                    operator: AnyNotIn
                    value: "{{ element.securityContext.capabilities.drop[] || `[]` }}"
