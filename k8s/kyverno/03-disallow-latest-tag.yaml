apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: cnas-disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Require Explicit Non-latest Image Tags
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
spec:
  background: true
  failurePolicy: Fail
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - cnas
      validate:
        failureAction: Enforce
        message: All container images must declare an explicit tag.
        foreach:
          - list: request.object.spec.containers
            pattern:
              image: "*:*"
          - list: request.object.spec.initContainers
            pattern:
              image: "*:*"
          - list: request.object.spec.ephemeralContainers
            pattern:
              image: "*:*"
    - name: reject-latest-tag
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - cnas
      validate:
        failureAction: Enforce
        message: The mutable latest image tag is not allowed.
        foreach:
          - list: request.object.spec.containers
            pattern:
              image: "!*:latest"
          - list: request.object.spec.initContainers
            pattern:
              image: "!*:latest"
          - list: request.object.spec.ephemeralContainers
            pattern:
              image: "!*:latest"
