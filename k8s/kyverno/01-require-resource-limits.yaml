apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: cnas-require-resources
  annotations:
    policies.kyverno.io/title: Require CPU and Memory Resources
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
spec:
  background: true
  failurePolicy: Fail
  rules:
    - name: require-container-and-init-resources
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - cnas
      preconditions:
        all:
          - key: "{{ request.operation || 'BACKGROUND' }}"
            operator: NotEquals
            value: DELETE
      validate:
        failureAction: Enforce
        message: Every container and init container must set CPU/memory requests and limits.
        foreach:
          - list: request.object.spec.containers
            pattern:
              resources:
                requests:
                  cpu: "?*"
                  memory: "?*"
                limits:
                  cpu: "?*"
                  memory: "?*"
          - list: request.object.spec.initContainers
            pattern:
              resources:
                requests:
                  cpu: "?*"
                  memory: "?*"
                limits:
                  cpu: "?*"
                  memory: "?*"
