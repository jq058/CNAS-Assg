apiVersion: v1
kind: ServiceAccount
metadata:
  name: mysql-exporter-sa
  namespace: cnas
  labels:
    app.kubernetes.io/name: mysql-exporter
    app.kubernetes.io/part-of: cnas-observability
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-exporter
  namespace: cnas
  labels:
    app.kubernetes.io/name: mysql-exporter
    app.kubernetes.io/part-of: cnas-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql-exporter
        app.kubernetes.io/part-of: cnas-observability
    spec:
      serviceAccountName: mysql-exporter-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql-exporter
          image: prom/mysqld-exporter:v0.19.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.my-cnf=/etc/mysql-exporter/config.my.cnf
          ports:
            - name: metrics
              containerPort: 9104
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: exporter-config
              mountPath: /etc/mysql-exporter
              readOnly: true
      volumes:
        - name: exporter-config
          secret:
            secretName: mysql-exporter-secret
            defaultMode: 0440
            items:
              - key: config.my.cnf
                path: config.my.cnf
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-exporter
  namespace: cnas
  labels:
    app.kubernetes.io/name: mysql-exporter
    app.kubernetes.io/part-of: cnas-observability
spec:
  selector:
    app.kubernetes.io/name: mysql-exporter
  ports:
    - name: metrics
      port: 9104
      targetPort: metrics
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-allow-exporter
  namespace: cnas
  labels:
    app.kubernetes.io/part-of: cnas-observability
spec:
  podSelector:
    matchLabels:
      app: mysql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mysql-exporter
      ports:
        - protocol: TCP
          port: 3306
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-exporter-egress
  namespace: cnas
  labels:
    app.kubernetes.io/part-of: cnas-observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mysql-exporter
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: mysql
      ports:
        - protocol: TCP
          port: 3306
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-exporter-allow-prometheus
  namespace: cnas
  labels:
    app.kubernetes.io/part-of: cnas-observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mysql-exporter
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              cnas.openai/role: prometheus
      ports:
        - protocol: TCP
          port: 9104
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mysql-exporter
  namespace: cnas
  labels:
    app.kubernetes.io/part-of: cnas-observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql-exporter
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
