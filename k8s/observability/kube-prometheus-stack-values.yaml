# Resource-conscious values for a local three-node Kind cluster.
# The chart itself is pinned by scripts/Install-Observability.ps1.
fullnameOverride: monitoring

crds:
  enabled: true

defaultRules:
  create: true
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    retention: 24h
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 192Mi
    storage: {}

grafana:
  enabled: true
  admin:
    existingSecret: cnas-grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  defaultDashboardsEnabled: false
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
    datasources:
      enabled: true
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki-gateway.monitoring.svc.cluster.local
      isDefault: false
      jsonData:
        maxLines: 1000
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      # Grafana 13's dashboard search index and bundled plugins exceeded the
      # previous 384Mi limit when the CNAS dashboard was opened.
      memory: 768Mi
  persistence:
    enabled: false

prometheus:
  enabled: true
  prometheusSpec:
    replicas: 1
    retention: 24h
    retentionSize: 1GB
    enableAdminAPI: false
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorNamespaceSelector: {}
    probeSelectorNilUsesHelmValues: false
    probeNamespaceSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}
    podMetadata:
      labels:
        cnas.assg/role: prometheus
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 768Mi
    storageSpec: {}

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 192Mi

prometheus-node-exporter:
  enabled: false
