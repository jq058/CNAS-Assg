apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: cnas-app-service
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: cnas-observability
spec:
  interval: 30s
  scrapeTimeout: 10s
  module: http_2xx
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - http://php-service.cnas.svc.cluster.local/readyz.php
      labels:
        service: php-app
        probe_scope: internal-service
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: cnas-gateway
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: cnas-observability
spec:
  interval: 30s
  scrapeTimeout: 10s
  module: cnas_gateway
  prober:
    url: blackbox-exporter.monitoring.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://kong-gateway-proxy.kong.svc.cluster.local/
      labels:
        service: gateway
        probe_scope: gateway-api
