# Dedicated ServiceAccounts for each workload.
# Neither account is bound to any ClusterRole/Role,
# giving them the minimum possible API permissions.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: php-app-sa
  namespace: cnas
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mysql-sa
  namespace: cnas
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-migration-sa
  namespace: cnas
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mysql-backup-sa
  namespace: cnas
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redis-sa
  namespace: cnas
automountServiceAccountToken: false
