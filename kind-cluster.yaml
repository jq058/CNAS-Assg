kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cnas-cluster
networking:
  # kindnet does not enforce Kubernetes NetworkPolicy. The platform installer
  # installs the pinned Calico CNI before application workloads are created.
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
    extraPortMappings:
      # Kong is exposed as fixed NodePorts inside Kind. Bind only to localhost
      # so the coursework environment is not exposed to the local network.
      - containerPort: 30080
        hostPort: 80
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 30443
        hostPort: 443
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
  - role: worker
  - role: worker
